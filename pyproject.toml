[project]
name = "tmlt.core"
description = "Tumult's differential privacy primitives"
readme = "README.md"
authors = []
license = "Apache-2.0"

# NOTE (The-Everyone-Project fork): this integration branch pins a static
# PEP 440 local version instead of deriving it from the git tag, for the same
# reason as the release/0.19.1-ep-pandas branch: the 0.19.1 tag is not an
# ancestor of main, so the dynamic version resolves to ~0.18.2+dist -- which
# fails tmlt.analytics' `tmlt.core >=0.19.1,<0.20` pin for editable installs.
# `+ep.backend.N` sorts with 0.19.1, satisfies the pin, and cannot be uploaded
# to PyPI. Contents: upstream main (76d80fb) + pandas_truncation (12acfb2) +
# the pandas-backend work packages, and the review, simplify and comment passes
# over them. Upstream PRs are cut from the pr/* branches, never from this
# branch. Bump N when cutting fork wheels.
version = "0.19.1+ep.backend.3"

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering",
  "Topic :: Security",

  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
keywords = [
  "differential privacy",
]

requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy >=1.23.2,<2 ; python_version < '3.12'",
    "numpy >=1.26.0,<2 ; python_version >= '3.12'",
    "pandas >=1.4.0,<2 ; python_version < '3.11'",
    "pandas >=1.5.0,<2 ; python_version == '3.11'",
    "pandas >=2.2.0,<3 ; python_version >= '3.12'",
    "pyarrow >=23.0.1,<24",
    "pyspark[sql] >=3.3.1,<3.6 ; python_version < '3.11' and sys_platform != 'darwin'",
    "pyspark[sql] >=3.4.0,<3.6 ; python_version == '3.11' and sys_platform != 'darwin'",
    "pyspark[sql] >=3.5.0,<3.6 ; python_version <= '3.11' and sys_platform == 'darwin'",
    "pyspark[sql] >=4,<5 ; python_version >= '3.12'",
    "randomgen >=1.23.0,<=1.26.0 ; python_version < '3.11'",
    "randomgen >=1.26.0,<=2.3.0 ; python_version >= '3.11'",
    "scipy >=1.6.0,<2.0.0 ; python_version < '3.10'",
    "scipy >=1.8.0,<2.0.0 ; python_version == '3.10'",
    "scipy >=1.9.2,<2.0.0 ; python_version == '3.11'",
    "scipy >=1.11.2,<2.0.0 ; python_version >= '3.12'",
    "sympy >=1.8,<1.13",
    "typeguard >=4.0.0,<5",
    # This works around a bug in some older versions of PySpark. We should
    # determine what versions are affected and, when possible, remove the extra
    # dependency.
    "setuptools >=70.0.0",
]

[project.optional-dependencies]
testing = [
    "pytest >=9.0.3,<10",
]

[project.urls]
documentation = "https://docs.tmlt.dev/core/latest/"
repository = "https://github.com/opendp/tumult-core"

[tool.uv]
required-version = ">=0.7.0"
default-groups = "all"

[dependency-groups]
build = ["cibuildwheel >=2,<3"]
ruff = ["ruff >=0.14.3,<1"]
isort = ["isort >=5.11,<6"]
mypy = ["mypy >=1.14.0"]
test = [
    "parameterized >=0.7.4,<0.8",
    "pytest",
    "pytest-cov >=7.1.0,<8",
    "pytest-xdist >=3.6,<4",
]
docs = [
    "pydata-sphinx-theme >=0.14.4,<15",
    "sphinx >=7.2.0,<8",
    "sphinx-autoapi >=3.1.1,<4",
    "sphinx-autodoc-typehints >=2.0.1,<3",
    "sphinx-automodapi >=0.17.0,<0.18",
    "sphinx-copybutton >=0.5.2,<0.6",
    "sphinx-design >=0.5.0,<0.6",
    "sphinx-reredirects >=0.1.5,<0.2",
    "sphinxcontrib-bibtex >=2.6.2,<3",
    "sphinxcontrib-images >=1.0,<2",
    "pytest",
]
docs-examples = [
    "matplotlib >=3.1.0,<4",
    "seaborn >=0.13.0,<0.14",
]
audit = ["pip-audit >=2.9.0,<3"]
ci-tools = ["requests >=2.31.0,<3"]
scripting = [
    "nox >=2024.03.02",
    "tmlt.nox_utils"
]

[tool.uv.sources]
# Switch which of these is commented out to test local changes to nox-utils:
# "tmlt.nox_utils" = { path = "../tumult-tools/nox-utils", editable = true }
"tmlt.nox_utils" = { git = "https://github.com/opendp/tumult-tools.git", subdirectory = "nox-utils" }

################################################################################
# Build configuration

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# NOTE (The-Everyone-Project fork): `[tool.hatch.version]` is intentionally
# removed -- the build no longer derives a version from git, it uses the static
# `version` in `[project]` above.
#
# `[tool.uv-dynamic-versioning]` below is kept only because tmlt.nox_utils reads
# it (via uv_dynamic_versioning.main.get_version) when noxfile.py is imported;
# without it, every nox session dies with
# `AttributeError: 'NoneType' object has no attribute 'vcs'`. The constant
# `format-jinja` makes it report the same version the build produces rather than
# a tag-derived version, and `fallback-version` covers shallow CI clones where
# no tag is reachable.
[tool.uv-dynamic-versioning]
vcs = "git"
style = "semver"
# The default configuration expect vX.Y.Z, but we haven't been using the 'v' prefix.
pattern = "^(?P<base>\\d+\\.\\d+\\.\\d+)(-(?P<stage>[a-zA-Z]+)\\.(?P<revision>\\d+))?"
commit-length = 8
format-jinja = "0.19.1+ep.backend.3"
fallback-version = "0.19.1+ep.backend.3"

[tool.hatch.build.hooks.version]
path = "src/tmlt/core/_version.py"
template = '''
"""Package version information."""
__version__ = "{version}"
'''

[tool.hatch.build.hooks.custom]
path = "ext/build.py"
[tool.hatch.build.targets.sdist]
only-include = [
  "CHANGELOG.rst",
  "benchmark/",
  "doc/",
  "ext/",
  "src/",
  "test/",
  "LICENSE",
  "NOTICE",
]
[tool.hatch.build.targets.wheel]
packages = ["src/tmlt"]
artifacts = [
    "src/tmlt/core/ext/__init__.py",
    "src/tmlt/core/ext/lib/__init__.py",
    # Only include the needed copy of each library -- the build process
    # generates multiple symlinks to each library, which are converted into
    # separate, identical files when building the wheel.
    "src/tmlt/core/ext/lib/*.so.*.*.*",
    "src/tmlt/core/ext/lib/libarb-*.dylib",
    "src/tmlt/core/ext/lib/libflint-*.dylib",
    "src/tmlt/core/ext/lib/libgmp.*.dylib",
    "src/tmlt/core/ext/lib/libmpfr.*.dylib",
]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-*"
skip = "*-musllinux*"
before-all = """
if [ -d src/tmlt/core/ext/lib ] && [ ! -z ${CI+x} ]; then
  echo 'Found compiled vendor libraries, but these must be built fresh by cibuildwheel.'
  exit 1
fi"""

[tool.cibuildwheel.macos]
environment = "MACOSX_DEPLOYMENT_TARGET='11.0'"

[tool.cibuildwheel.linux]
archs = ["x86_64"]


################################################################################
# Test configuration

[tool.pytest.ini_options]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "spark: marks tests that need a Spark session (deselect with '-m \"not spark\"')",
]

[tool.coverage.run]
omit = ["**/core/ext/*"]

[tool.coverage.paths]
# Treat all nox environments as the same for the purposes of coverage. This
# makes the paths reported by coverage a lot cleaner, and in future could allow
# us to combine the coverage data from multiple test jobs into a single report.
source = ["src/tmlt/core", ".nox/**/site-packages/tmlt/core"]

################################################################################
# Linter configuration

[tool.ruff.lint]
# Enable preview rules, but only ones that are explicitly enabled; there are a
# handful of rules we want that are in preview, but for the most part we can
# wait for rules to stabilize.
preview = true
explicit-preview-rules = true

# A list of all of Ruff's rules can be found at https://docs.astral.sh/ruff/rules/
select = [
    "NPY201", # Support numpy migration
    # Enable Ruff-specific lints plus Pylint, pydocstyle, pyflakes, and pycodestyle.
    # The latter two cover many lints that we previously used pylint for, but
    # because they are overlapping Ruff only implements them in one set of rules.
    "RUF", "PL", "D", "F", "E", "W",
    # Also enable a subset of flake8 rules, for similar reasons to pyflakes/pycodestyle.
    "ISC", "SLF",

    # Various preview rules that we want to use
    "DOC102", # docstring-extraneous-parameter
    "DOC202", # docstring-extraneous-returns
]
ignore = [
    # too-many-*: These rules are too context-dependent to be generally useful,
    #     we can evaluate this during code reviews.
    "PLR09",
    # magic-value-comparison: This rule flags a lot of constants that don't
    #     really make sense, we can make this call during code reviews.
    "PLR2004",
    # explicit-f-string-type-conversion: we don't generally use the !r syntax in
    #     f-strings, which this rule enforces.
    "RUF010",
    # eq-without-hash: Core contains several classes with custom __eq__
    #     implementations where we don't care that the class isn't hashable.
    "PLW1641",
    # lambda-assignment: Core frequently assigns lambdas to variables, for
    #     example when constructing post-processing steps, and these cases
    #     aren't always clearer when written as normal function definitions.
    "E731",
    # ambiguous-variable-name: This tries to warn about variable names that are
    #     easily confused with other symbols (e.g. l vs 1).
    "E741",
]

# Ruff's RUF001-003 rules disallow certain Unicode characters that are easily
# confused with ASCII characters; this makes sense for the most part, but some
# of our docstrings use Greek letters that fall into that category. This allows
# those characters.
allowed-confusables = ['α', 'ρ', '𝝆']

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
explicit_package_bases = true
follow_imports = "silent"
ignore_missing_imports = true
namespace_packages = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
# TODO: Re-enable this and fix the resulting warnings
# warn_unreachable = true

[[tool.mypy.overrides]]
module = "test.*"
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tmlt.core.utils.arb"
disallow_untyped_defs = false
check_untyped_defs = true
