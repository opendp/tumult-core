# This pipeline is executed every time someone pushes a tag to GitHub. If the
# tag is a valid version number, it builds the library, and 
# runs the slow tests, the benchmarks, and then dependency matrix.
# It will eventually push the package distribution to PyPI,
# and if this is a production release, also publish the docs.
name: Release Pipeline

#
# NOTE (The-Everyone-Project fork): only the three Package-* jobs are enabled
# on this fork; they build the wheels that are attached to a GitHub Release on
# the fork. Every other job -- including Publish-To-PyPI and Push-Docs -- keeps
# its original `github.repository == 'opendp/tumult-core'` guard and therefore
# never runs here. Nothing from this fork is ever published to PyPI.
on:
  push:
    tags:
      - '**'
  workflow_dispatch:


env:
  # Force nox to produce colorful logs:
  FORCE_COLOR: "true"

jobs:
  Check-Tag-Pattern:
    if: github.repository == 'opendp/tumult-core'
    runs-on: ubuntu-latest
    steps:
      - run: |
          re="^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$"
          if [[ ! "$GITHUB_REF_NAME" =~ $re ]]; then 
            echo "Tag $GITHUB_REF_NAME is not a valid version number. Aborting release pipeline."
            exit 1
          fi

  # `needs: Check-Tag-Pattern` is dropped from the three Package jobs on the
  # fork: Check-Tag-Pattern is still guarded to opendp/tumult-core, so here it
  # is skipped, and a skipped dependency would skip the Package jobs too. Its
  # regex also rejects the fork's tag format by design.
  Package-linux:
    if: github.repository == 'The-Everyone-Project/tumult-core'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up runner
        uses: opendp/tumult-tools/actions/setup@eabe1054863f0916a0087ad180fd83719049c094
      - run: uv run --only-group scripting nox -s build
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: linux-wheel
          path: dist/*.whl
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  Package-macos-intel:
    if: github.repository == 'The-Everyone-Project/tumult-core'
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up runner
        uses: opendp/tumult-tools/actions/setup@eabe1054863f0916a0087ad180fd83719049c094
      - run: uv run --only-group scripting nox -s build
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-wheel
          path: dist/*.whl

  Package-macos-arm:
    if: github.repository == 'The-Everyone-Project/tumult-core'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up runner
        uses: opendp/tumult-tools/actions/setup@eabe1054863f0916a0087ad180fd83719049c094
      - run: uv run --only-group scripting nox -s build
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm-wheel
          path: dist/*.whl

  Test-Slow:
    if: github.repository == 'opendp/tumult-core'
    runs-on: ubuntu-latest
    needs: Package-linux
    steps:
      - name: Checkout code repository
        uses: actions/checkout@v4
      - name: Set up runner
        uses: opendp/tumult-tools/actions/setup@eabe1054863f0916a0087ad180fd83719049c094
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: linux-wheel
          path: dist
      - run: uv run nox -s test-slow

  Benchmark:
    if: github.repository == 'opendp/tumult-core'
    runs-on: ubuntu-latest
    needs: Package-linux
    steps:
      - name: Checkout code repository
        uses: actions/checkout@v4
      - name: Set up runner
        uses: opendp/tumult-tools/actions/setup@eabe1054863f0916a0087ad180fd83719049c094
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: linux-wheel
          path: dist
      - run: uv run nox -t benchmark

  Dependency-Matrix:
    if: github.repository == 'opendp/tumult-core'
    strategy:
      fail-fast: false
      matrix:
        # Note: mac runners are rather expensive (10x multiplier) so we don't use them here.
        os: [ubuntu-latest]
        dependencies: [oldest, newest]
        python: ["3.10", "3.12"]
        include:
          - python: "3.10"
            java-version: "8"
          - python: "3.12"
            java-version: "17"
    runs-on: ${{ matrix.os }}
    needs: Package-linux
    steps:
      - name: Checkout code repository
        uses: actions/checkout@v4
      - name: Set up runner
        uses: opendp/tumult-tools/actions/setup@eabe1054863f0916a0087ad180fd83719049c094
        with:
          java-version: ${{ matrix.java-version }}
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: linux-wheel
          path: dist
      - run: uv run nox -s "test_dependency_matrix(${{matrix.python}}-${{matrix.dependencies}})"
        env: 
          SPARK_LOCAL_HOSTNAME: localhost

  Publish-To-PyPI:
    if: github.repository == 'opendp/tumult-core'
    runs-on: ubuntu-latest
    needs:
      - Test-Slow
      - Benchmark
      - Dependency-Matrix
      - Package-linux
      - Package-macos-arm
      - Package-macos-intel
    environment:
      name: pypi
      url: https://pypi.org/p/tmlt-core
    permissions:
      id-token: write
    steps:
      - name: Download linux wheel
        uses: actions/download-artifact@v4
        with:
          name: linux-wheel
          path: dist
      - name: Download mac arm wheel
        uses: actions/download-artifact@v4
        with:
          name: macos-arm-wheel
          path: dist
      - name: Download mac intel wheel
        uses: actions/download-artifact@v4
        with:
          name: macos-intel-wheel
          path: dist
      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  Push-Docs:
    if: ${{ github.repository == 'opendp/tumult-core'
              && ! contains(github.ref_name, 'alpha')
              && ! contains(github.ref_name, 'beta')
              && ! contains(github.ref_name, 'rc') }}
    runs-on: ubuntu-latest
    environment: docs-push
    needs: Publish-To-PyPI
    steps:
      - name: Checkout code repository
        uses: actions/checkout@v4
      - name: Set up runner
        uses: opendp/tumult-tools/actions/setup@eabe1054863f0916a0087ad180fd83719049c094
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: linux-wheel
          path: dist
      - run: |
          re="^([0-9]+)\.([0-9]+).*$"
          [[ $GITHUB_REF_NAME =~ $re ]]
          echo "MAJOR_VERSION=${BASH_REMATCH[1]}" >> $GITHUB_ENV
          echo "MINOR_VERSION=${BASH_REMATCH[2]}" >> $GITHUB_ENV
      - name: Push docs
        uses: opendp/tumult-tools/actions/push_docs@df58d56705007d8b7ad1b66280df7465afa15a49
        with:
          docs-repository: opendp/tumult-docs
          docs-repository-token: ${{ secrets.DOCS_REPO_PAT }}
          docs-path: docs/core
          version: ${{ format('v{0}.{1}', env.MAJOR_VERSION, env.MINOR_VERSION) }}
