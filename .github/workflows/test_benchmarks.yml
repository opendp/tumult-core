name: Test Pipeline

on:
  push:


env:
  # Force nox to produce colorful logs:
  FORCE_COLOR: "true"

jobs:
  Package-linux:
    if: github.repository == 'opendp/tumult-core'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up runner
        uses: opendp/tumult-tools/actions/setup@eabe1054863f0916a0087ad180fd83719049c094
      - run: uv run --only-group scripting nox -s build
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: linux-wheel
          path: dist/*.whl
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  Benchmark:
    if: github.repository == 'opendp/tumult-core'
    runs-on: ubuntu-latest
    needs: Package-linux
    steps:
      - name: Checkout code repository
        uses: actions/checkout@v4
      - name: Set up runner
        uses: opendp/tumult-tools/actions/setup@eabe1054863f0916a0087ad180fd83719049c094
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: linux-wheel
          path: dist
      - run: uv run nox -t benchmark